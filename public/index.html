<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BAFICI 27° - Catálogo de Películas</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #fff;
        }

        header {
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(10px);
            padding: 2rem;
            text-align: center;
            border-bottom: 3px solid #e94560;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        h1 { font-size: 2.5rem; color: #e94560; margin-bottom: 0.5rem; }
        .subtitle { font-size: 1.1rem; color: #a2a8d3; }
        .dates { font-size: 1rem; background: #e94560; display: inline-block; padding: 0.4rem 1.2rem; border-radius: 20px; margin-top: 0.8rem; }

        .container { max-width: 1600px; margin: 0 auto; padding: 2rem; }

        .search-section {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 1.5rem;
            margin-bottom: 2rem;
        }

        .search-box { display: flex; gap: 1rem; flex-wrap: wrap; margin-bottom: 1rem; }

        .search-input, .filter-select {
            padding: 0.8rem 1.2rem;
            font-size: 1rem;
            border: none;
            border-radius: 25px;
            background: rgba(255, 255, 255, 0.9);
            color: #333;
            outline: none;
        }

        .search-input { flex: 1; min-width: 250px; }
        .filter-select { min-width: 150px; cursor: pointer; }

        .stats { display: flex; gap: 1.5rem; justify-content: center; flex-wrap: wrap; }
        .stat-item { text-align: center; padding: 0.8rem 1.2rem; background: rgba(233, 69, 96, 0.2); border-radius: 10px; }
        .stat-number { font-size: 1.5rem; font-weight: bold; color: #e94560; }
        .stat-label { font-size: 0.85rem; color: #a2a8d3; }

        .movies-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.5rem;
        }

        .movie-card {
            background: rgba(255, 255, 255, 0.06);
            border-radius: 15px;
            overflow: hidden;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.1);
            cursor: pointer;
        }

        .movie-card:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            border-color: #e94560;
        }

        .movie-poster { width: 100%; height: 220px; object-fit: cover; background: #1a1a2e; }

        .movie-content { padding: 1.2rem; }

        .movie-title { font-size: 1.15rem; color: #fff; margin-bottom: 0.3rem; font-weight: 600; line-height: 1.3; }
        .movie-title-en { font-size: 0.9rem; color: #a2a8d3; margin-bottom: 0.5rem; font-style: italic; }
        
        .movie-director {
            font-size: 0.9rem;
            color: #e94560;
            margin-bottom: 0.8rem;
            font-weight: 500;
        }

        .movie-meta { display: flex; gap: 0.8rem; flex-wrap: wrap; margin-bottom: 0.8rem; }
        .movie-meta span {
            font-size: 0.8rem;
            padding: 0.3rem 0.6rem;
            background: rgba(233, 69, 96, 0.3);
            border-radius: 12px;
        }

        .movie-desc {
            font-size: 0.85rem;
            color: #a2a8d3;
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .read-more {
            font-size: 0.8rem;
            color: #e94560;
            margin-top: 0.5rem;
            cursor: pointer;
        }

        .read-more:hover { text-decoration: underline; }

        .no-results {
            text-align: center;
            padding: 3rem;
            color: #a2a8d3;
            font-size: 1.2rem;
            grid-column: 1 / -1;
        }

        /* Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(5px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }

        .modal-overlay.active { display: flex; }

        .modal {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            border-radius: 20px;
            max-width: 800px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            border: 2px solid #e94560;
            position: relative;
        }

        .modal-close {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: #e94560;
            border: none;
            color: #fff;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 1.5rem;
            cursor: pointer;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-close:hover { background: #d63851; }

        .modal-image { width: 100%; height: 300px; object-fit: cover; }

        .modal-content { padding: 2rem; }

        .modal-title { font-size: 1.8rem; color: #fff; margin-bottom: 0.5rem; }
        .modal-title-en { font-size: 1.1rem; color: #a2a8d3; font-style: italic; margin-bottom: 1rem; }
        
        .modal-director {
            font-size: 1.1rem;
            color: #e94560;
            margin-bottom: 1rem;
            font-weight: 500;
        }

        .modal-meta { display: flex; gap: 1rem; flex-wrap: wrap; margin-bottom: 1.5rem; }
        .modal-meta span {
            font-size: 0.9rem;
            padding: 0.4rem 0.8rem;
            background: rgba(233, 69, 96, 0.3);
            border-radius: 15px;
        }

        .modal-desc {
            font-size: 1rem;
            color: #a2a8d3;
            line-height: 1.8;
        }

        footer {
            text-align: center;
            padding: 2rem;
            margin-top: 2rem;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            color: #a2a8d3;
            font-size: 0.85rem;
        }

        footer a { color: #e94560; text-decoration: none; }

        @media (max-width: 768px) {
            h1 { font-size: 1.8rem; }
            .container { padding: 1rem; }
            .movies-grid { grid-template-columns: 1fr; }
            .modal { margin: 1rem; }
            .modal-image { height: 200px; }
        }
    </style>
</head>
<body>
    <header>
        <h1>BAFICI 27°</h1>
        <div class="subtitle">Buenos Aires Festival Internacional de Cine Independiente</div>
        <div class="dates">15 al 26 de Abril 2026</div>
    </header>

    <div class="container">
        <div class="search-section">
            <div class="search-box">
                <input type="text" class="search-input" id="searchInput" placeholder="Buscar por título, director o país...">
                <select class="filter-select" id="countryFilter">
                    <option value="">Todos los países</option>
                </select>
                <select class="filter-select" id="yearFilter">
                    <option value="">Todos los años</option>
                </select>
            </div>
            <div class="stats">
                <div class="stat-item">
                    <div class="stat-number" id="totalMovies">0</div>
                    <div class="stat-label">Películas</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number" id="totalCountries">0</div>
                    <div class="stat-label">Países</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number" id="showingCount">0</div>
                    <div class="stat-label">Mostrando</div>
                </div>
            </div>
        </div>

        <div class="movies-grid" id="moviesContainer"></div>
    </div>

    <!-- Modal -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <button class="modal-close" onclick="closeModal()">×</button>
            <img class="modal-image" id="modalImage" src="" alt="">
            <div class="modal-content">
                <h2 class="modal-title" id="modalTitle"></h2>
                <div class="modal-title-en" id="modalTitleEn"></div>
                <div class="modal-director" id="modalDirector"></div>
                <div class="modal-meta" id="modalMeta"></div>
                <div class="modal-desc" id="modalDesc"></div>
            </div>
        </div>
    </div>

    <footer>
        <p>Catálogo extraído del PDF oficial del BAFICI 27°</p>
        <p><a href="https://bafici.org" target="_blank">bafici.org</a></p>
    </footer>

    <script src="movies_data.js"></script>
    <script>
        var movies = moviesData || [];

        function init() {
            var countries = [];
            var years = [];
            var countrySet = {};
            var yearSet = {};
            
            for (var i = 0; i < movies.length; i++) {
                if (!countrySet[movies[i].country]) {
                    countrySet[movies[i].country] = true;
                    countries.push(movies[i].country);
                }
                if (!yearSet[movies[i].year]) {
                    yearSet[movies[i].year] = true;
                    years.push(movies[i].year);
                }
            }
            
            countries.sort();
            years.sort().reverse();

            var countryFilter = document.getElementById('countryFilter');
            for (var i = 0; i < countries.length; i++) {
                var opt = document.createElement('option');
                opt.value = countries[i];
                opt.textContent = countries[i];
                countryFilter.appendChild(opt);
            }

            var yearFilter = document.getElementById('yearFilter');
            for (var i = 0; i < years.length; i++) {
                var opt = document.createElement('option');
                opt.value = years[i];
                opt.textContent = years[i];
                yearFilter.appendChild(opt);
            }

            document.getElementById('totalMovies').textContent = movies.length;
            document.getElementById('totalCountries').textContent = countries.length;

            renderMovies(movies);

            document.getElementById('searchInput').addEventListener('input', filterMovies);
            document.getElementById('countryFilter').addEventListener('change', filterMovies);
            document.getElementById('yearFilter').addEventListener('change', filterMovies);
            document.getElementById('modalOverlay').addEventListener('click', function(e) {
                if (e.target === this) closeModal();
            });
        }

        function renderMovies(moviesToRender) {
            var container = document.getElementById('moviesContainer');
            document.getElementById('showingCount').textContent = moviesToRender.length;

            if (moviesToRender.length === 0) {
                container.innerHTML = '<div class="no-results">No se encontraron películas</div>';
                return;
            }

            var html = '';
            for (var i = 0; i < moviesToRender.length; i++) {
                var m = moviesToRender[i];
                var hasLongDesc = m.description && m.description.length > 150;
                
                html += '<div class="movie-card" onclick="openModal(' + i + ')">';
                html += '<img class="movie-poster" src="' + m.image + '" alt="' + m.title + '" onerror="this.style.display=\'none\'">';
                html += '<div class="movie-content">';
                html += '<div class="movie-title">' + m.title + '</div>';
                if (m.title_en) {
                    html += '<div class="movie-title-en">' + m.title_en + '</div>';
                }
                if (m.director) {
                    html += '<div class="movie-director">Dir: ' + m.director + '</div>';
                }
                html += '<div class="movie-meta">';
                html += '<span>' + m.country + '</span>';
                html += '<span>' + m.year + '</span>';
                html += '<span>' + m.duration + '</span>';
                html += '</div>';
                if (m.description) {
                    html += '<div class="movie-desc">' + m.description + '</div>';
                    if (hasLongDesc) {
                        html += '<div class="read-more">Ver más...</div>';
                    }
                }
                html += '</div></div>';
            }
            
            container.innerHTML = html;
        }

        function openModal(index) {
            var m = movies[index];
            document.getElementById('modalImage').src = m.image;
            document.getElementById('modalTitle').textContent = m.title;
            document.getElementById('modalTitleEn').textContent = m.title_en || '';
            document.getElementById('modalDirector').textContent = m.director ? 'Dir: ' + m.director : '';
            
            var metaHtml = '<span>' + m.country + '</span>';
            metaHtml += '<span>' + m.year + '</span>';
            metaHtml += '<span>' + m.duration + '</span>';
            if (m.language) metaHtml += '<span>' + m.language + '</span>';
            document.getElementById('modalMeta').innerHTML = metaHtml;
            
            document.getElementById('modalDesc').textContent = m.description || 'Sin descripción disponible.';
            document.getElementById('modalOverlay').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            document.getElementById('modalOverlay').classList.remove('active');
            document.body.style.overflow = '';
        }

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') closeModal();
        });

        function filterMovies() {
            var search = document.getElementById('searchInput').value.toLowerCase();
            var country = document.getElementById('countryFilter').value;
            var year = document.getElementById('yearFilter').value;

            var filtered = [];

            for (var i = 0; i < movies.length; i++) {
                var m = movies[i];
                var match = true;

                if (search) {
                    var searchMatch = m.title.toLowerCase().includes(search) ||
                        (m.title_en && m.title_en.toLowerCase().includes(search)) ||
                        (m.director && m.director.toLowerCase().includes(search)) ||
                        m.country.toLowerCase().includes(search);
                    if (!searchMatch) match = false;
                }

                if (country && m.country !== country) match = false;
                if (year && m.year !== year) match = false;

                if (match) filtered.push(m);
            }

            renderMovies(filtered);
        }

        document.addEventListener('DOMContentLoaded', function() {
            if (movies.length > 0) init();
        });
    </script>
</body>
</html>
